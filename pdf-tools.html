<style>
* {
  box-sizing: border-box;

body {
  margin: 0;
  padding: 20px;
  background: #080d1b;

  font-family: Arial, sans-serif;

.box {
  max-width: 500px;
  margin: 25px auto;
  padding: 25px;
  background: #111b30;

button {
  padding: 13px 20px;

  margin: 15px 0;

  color: #42a5ff;
  overflow-wrap: anywhere;

<body>

<h1>RAVILOOP PDF Tools</h1>
<p>Simple and free PDF tools</p>

<div class="box">

  <h2>Merge PDF Files</h2>

  <p>Select multiple PDF files to combine them.</p>

  <input
    type="file"
    id="files"
    accept="application/pdf,.pdf"
    multiple
  >

  <br>

  <button onclick="mergePDF()">Merge PDFs</button>

  <p id="status"></p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>

async function mergePDF() {

  const files = document.getElementById("files").files;
  const status = document.getElementById("status");

  if (files.length < 2) {
    status.textContent = "Please select at least 2 PDF files.";
    return;
  }

  if (typeof PDFLib === "undefined") {
    status.textContent = "PDF library could not load. Check your internet connection.";
    return;
  }

  try {

    status.textContent = "Merging PDFs...";

    const mergedPDF = await PDFLib.PDFDocument.create();

    for (const file of files) {

      const bytes = await file.arrayBuffer();

      const pdf = await PDFLib.PDFDocument.load(bytes);

      const pages = await mergedPDF.copyPages(
        pdf,
        pdf.getPageIndices()
      );

      pages.forEach(page => {
        mergedPDF.addPage(page);
      });

    }

    const result = await mergedPDF.save();

    const blob = new Blob(
      [result],
      { type: "application/pdf" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "raviloop-merged.pdf";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 1000);

    status.textContent = "PDF merged successfully!";

  } catch (error) {

    status.textContent = "Error: " + error.message;

  }

}

</script>

</body>
