<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #42a5ff;
}

.box {
  max-width: 500px;
  margin: 25px auto;
  padding: 25px;
  background: #111b30;
  border: 1px solid #263957;
  border-radius: 15px;
}

input[type="number"] {
  width: 75px;
  padding: 10px;
  border-radius: 7px;
}

input[type="checkbox"] {
  margin-right: 8px;
  accent-color: #1685e8;
}

.option {
  display: block;
  text-align: left;
  margin: 15px 0;
}

#password {
  width: 100%;
  padding: 14px;
  background: #080d1b;
  color: white;
  border: 1px solid #42a5ff;
  border-radius: 8px;
  font-size: 16px;
  text-align: center;
}

button {
  padding: 13px 20px;
  margin: 8px;
  background: #1685e8;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}

#strength {
  margin-top: 15px;
  color: #42a5ff;
}

<body>

<h1>RAVILOOP Password Generator</h1>
<p>Create strong and secure passwords</p>

<div class="box">

  <h2>Generate Password</h2>

  <p>Password Length</p>
  <input type="number" id="length" min="8" max="32" value="16">

  <label class="option">
    <input type="checkbox" id="uppercase" checked>
    Uppercase Letters (A-Z)
  </label>

  <label class="option">
    <input type="checkbox" id="lowercase" checked>
    Lowercase Letters (a-z)
  </label>

  <label class="option">
    <input type="checkbox" id="numbers" checked>
    Numbers (0-9)
  </label>

  <label class="option">
    <input type="checkbox" id="symbols" checked>
    Symbols (!@#$%)
  </label>

  <button onclick="generatePassword()">
    Generate Password
  </button>

  <input type="text" id="password"
  placeholder="Your password will appear here"
  readonly>

  <br>

  <button onclick="copyPassword()">Copy Password</button>

  <p id="strength">Password strength: Not generated</p>

</div>

<script>

function generatePassword() {

  const length = Number(document.getElementById("length").value);

  if (!Number.isInteger(length) || length < 8 || length > 32) {
    alert("Please choose a length between 8 and 32.");
    return;
  }

  let characters = "";

  if (document.getElementById("uppercase").checked)
    characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  if (document.getElementById("lowercase").checked)
    characters += "abcdefghijklmnopqrstuvwxyz";

  if (document.getElementById("numbers").checked)
    characters += "0123456789";

  if (document.getElementById("symbols").checked)
    characters += "!@#$%^&*()_+-=[]{}?";

  if (!characters) {
    alert("Please select at least one option.");
    return;
  }

  const randomValues = new Uint32Array(length);
  crypto.getRandomValues(randomValues);

  let password = "";

  for (let i = 0; i < length; i++) {
    password += characters[randomValues[i] % characters.length];
  }

  document.getElementById("password").value = password;

  let types = 0;

  if (/[A-Z]/.test(password)) types++;
  if (/[a-z]/.test(password)) types++;
  if (/[0-9]/.test(password)) types++;
  if (/[^A-Za-z0-9]/.test(password)) types++;

  let strength = "Weak";

  if (length >= 12 && types >= 3)
    strength = "Strong";

  if (length >= 16 && types === 4)
    strength = "Very Strong";

  document.getElementById("strength").textContent =
    "Password strength: " + strength;
}

async function copyPassword() {

  const password = document.getElementById("password").value;

  if (!password) {
    alert("Generate a password first.");
    return;
  }

  try {
    await navigator.clipboard.writeText(password);
    alert("Password copied successfully!");
  } catch (error) {
    const field = document.getElementById("password");
    field.select();
    document.execCommand("copy");
    alert("Password copied!");
  }
}

</script>

</body>
