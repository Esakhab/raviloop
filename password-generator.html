
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVILOOP Password Generator</title>

<style>
body {
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
}
h1 { color: #42a5ff; margin-top: 35px; }
.container {
  max-width: 420px;
  margin: 35px auto;
  padding: 25px;
  background: #111b30;
  border: 1px solid #263957;
  border-radius: 18px;
}
input[type="number"] {
  width: 65px;
  padding: 10px;
  background: #080d1b;
  color: white;
  border: 1px solid #304263;
  border-radius: 8px;
}
.option { text-align: left; margin: 18px 0; }
button {
  background: #1685ff;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 9px;
  margin: 10px 5px;
  cursor: pointer;
  font-size: 15px;
}
#result {
  background: #080d1b;
  padding: 15px;
  border: 1px solid #304263;
  border-radius: 10px;
  margin-top: 20px;
  overflow-wrap: anywhere;
  color: #42a5ff;
  font-size: 18px;
}
#strength {
  margin-top: 18px;
  font-weight: bold;
}
.bar {
  height: 9px;
  background: #263957;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}
#barFill {
  height: 100%;
  width: 0%;
  background: #ff4545;
  transition: 0.3s;
}
</style>
</head>

<body>
<h1>RAVILOOP</h1>
<p>Strong Password Generator</p>

<div class="container">
<h2>Create Password</h2>

<div class="option">
<label>Password Length:</label>
<input type="number" id="length" value="16" min="8" max="32">
</div>

<div class="option">
<label><input type="checkbox" id="uppercase" checked> Capital Letters (A-Z)</label>
</div>

<div class="option">
<label><input type="checkbox" id="lowercase" checked> Small Letters (a-z)</label>
</div>

<div class="option">
<label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
</div>

<div class="option">
<label><input type="checkbox" id="symbols" checked> Special Symbols (!@#$)</label>
</div>

<button onclick="generatePassword()">Generate Password</button>

<div id="result">Your password will appear here</div>

<div id="strength">
Password Strength: Not checked
<div class="bar"><div id="barFill"></div></div>
</div>

<button onclick="copyPassword()">Copy Password</button>
<p id="message"></p>
</div>

<script>
function generatePassword() {
  const length = Number(document.getElementById("length").value);
  const groups = [];

  if (document.getElementById("uppercase").checked)
    groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");

  if (document.getElementById("lowercase").checked)
    groups.push("abcdefghijklmnopqrstuvwxyz");

  if (document.getElementById("numbers").checked)
    groups.push("0123456789");

  if (document.getElementById("symbols").checked)
    groups.push("!@#$%^&*()_+-=[]{}");

  const message = document.getElementById("message");

  if (!Number.isInteger(length) || length < 8 || length > 32) {
    message.innerText = "Choose a length between 8 and 32.";
    return;
  }

  if (groups.length === 0) {
    message.innerText = "Select at least one option!";
    return;
  }

  const all = groups.join("");
  let password = "";

  groups.forEach(group => {
    password += group[randomNumber(group.length)];
  });

  while (password.length < length) {
    password += all[randomNumber(all.length)];
  }

  password = password.split("");

  for (let i = password.length - 1; i > 0; i--) {
    const j = randomNumber(i + 1);
    [password[i], password[j]] = [password[j], password[i]];
  }

  password = password.join("");

  document.getElementById("result").innerText = password;
  checkStrength(password);
  message.innerText = "Password generated successfully!";
}

function randomNumber(max) {
  const array = new Uint32Array(1);
  const limit = Math.floor(4294967296 / max) * max;
  let value;

  do {
    crypto.getRandomValues(array);
    value = array[0];
  } while (value >= limit);

  return value % max;
}

function checkStrength(password) {
  let score = 0;

  if (password.length >= 12) score++;
  if (password.length >= 16) score++;
  if (/[A-Z]/.test(password)) score++;
  if (/[a-z]/.test(password)) score++;
  if (/[0-9]/.test(password)) score++;
  if (/[^A-Za-z0-9]/.test(password)) score++;

  const strength = document.getElementById("strength");
  const bar = document.getElementById("barFill");

  if (score <= 2) {
    strength.firstChild.textContent = "Password Strength: Weak";
    bar.style.width = "25%";
    bar.style.background = "#ff4545";
  } else if (score <= 4) {
    strength.firstChild.textContent = "Password Strength: Medium";
    bar.style.width = "65%";
    bar.style.background = "#ffbd35";
  } else {
    strength.firstChild.textContent = "Password Strength: Strong";
    bar.style.width = "100%";
    bar.style.background = "#20d878";
  }
}

function copyPassword() {
  const password = document.getElementById("result").innerText;

  if (password === "Your password will appear here") return;

  navigator.clipboard.writeText(password)
    .then(() => {
      document.getElementById("message").innerText = "Password copied!";
    })
    .catch(() => {
      document.getElementById("message").innerText =
        "Copy failed. Please copy manually.";
    });
}
</script>

</body>
</html>
